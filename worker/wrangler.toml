name = "northgo-admin"
main = "src/index.js"
compatibility_date = "2026-11-25"
workers_dev = true

[vars]
APP_VERSION = "0.1.6"

# Create the database, then replace database_id:
#   wrangler d1 create northgo
#   wrangler d1 execute northgo --remote --file=schema.sql
#   wrangler secret put SESSION_SECRET
[[d1_databases]]
binding = "DB"
database_name = "northgo"
database_id = "61395450-dbd7-4ffc-92b0-d583e2aff6c2"
