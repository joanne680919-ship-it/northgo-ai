<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Northgo（northgo.com）HTML 網站地圖 v1.0.3。依 2026-11-25 實地確認的可連頁面整理，符合 RWD。">
  <meta name="version" content="1.0.3">
  <title>Northgo 網站地圖</title>
  <style>
    :root { --navy:#0a1b33; --cyan:#00e5e5; --ink:#0a1b33; --muted:#5c6b7a; --line:#d7e3ec; --bg:#f3f7f8; --warn:#9a3412; --warn-bg:#fff4ec; }
    * { box-sizing:border-box; }
    body { margin:0; color:var(--ink); background:var(--bg); font-family:"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; line-height:1.55; }
    a { color:inherit; }
    .hero { background:radial-gradient(circle at 88% 10%, rgba(0,229,229,.22), transparent 28%), linear-gradient(160deg,#071526,#0a1b33 55%,#0e3358); color:#fff; padding:28px 0 36px; }
    .wrap { width:min(1120px, calc(100% - 32px)); margin:0 auto; }
    .brand { display:flex; justify-content:space-between; gap:16px; align-items:baseline; margin-bottom:18px; }
    .logo { display:inline-flex; align-items:center; gap:10px; min-height:44px; color:#fff; text-decoration:none; }
    .logo-img { display:block; height:34px; width:auto; }
    .logo-version { color:var(--navy); background:var(--cyan); border-radius:999px; font-size:.72rem; font-weight:700; letter-spacing:.03em; line-height:1; padding:5px 8px; }
    footer .wrap { display:flex; flex-wrap:wrap; gap:8px 18px; justify-content:space-between; align-items:center; }
    footer .version span { color:#086972; font-weight:650; }
    .meta { color:rgba(255,255,255,.72); font-size:.86rem; display:flex; flex-wrap:wrap; gap:8px 14px; justify-content:flex-end; }
    .meta a { color:var(--cyan); }
    h1 { margin:0 0 8px; font-size:clamp(1.8rem,4vw,3rem); letter-spacing:-.04em; line-height:1.1; }
    .lede { max-width:42rem; margin:0; color:rgba(255,255,255,.84); }
    .stats { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:24px; }
    .stat { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:12px 14px; }
    .stat b { display:block; font-size:1.45rem; color:var(--cyan); }
    .stat span { font-size:.84rem; color:rgba(255,255,255,.78); }
    .toolbar { display:flex; flex-direction:column; gap:12px; margin-top:-22px; position:relative; z-index:2; }
    .panel { background:#fff; border:1px solid var(--line); border-radius:18px; box-shadow:0 10px 30px rgba(10,27,51,.06); padding:14px; }
    .search { width:100%; border:1px solid var(--line); border-radius:12px; padding:12px 14px; font:inherit; }
    .locales { display:flex; flex-wrap:wrap; gap:8px; }
    .locales button { border:1px solid var(--line); background:#fff; border-radius:999px; padding:8px 12px; font:inherit; cursor:pointer; }
    .locales button[aria-pressed="true"] { background:var(--navy); color:#fff; border-color:var(--navy); }
    .hint { margin:8px 0 0; color:var(--muted); font-size:.88rem; }
    main { padding:22px 0 48px; }
    .grid { display:grid; gap:16px; }
    .card { background:#fff; border:1px solid var(--line); border-radius:18px; padding:18px 18px 8px; }
    .card h2 { display:flex; justify-content:space-between; gap:10px; margin:0 0 6px; font-size:1.15rem; }
    .card > p { margin:0 0 12px; color:var(--muted); }
    .tree, .tree ul { list-style:none; margin:0; padding:0; }
    .tree ul { margin-left:12px; padding-left:14px; border-left:1px solid var(--line); }
    .node a, .plain { display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; text-decoration:none; padding:7px 0; }
    .name { font-weight:650; }
    .path { font-family:ui-monospace,Consolas,monospace; font-size:.78rem; color:var(--muted); word-break:break-all; }
    .badge { border-radius:999px; padding:1px 8px; font-size:.72rem; font-weight:700; background:#e7fbfb; color:#0b6e74; }
    .badge.anchor { background:#eef3f8; color:#34506b; }
    .badge.bad { background:var(--warn-bg); color:var(--warn); }
    .desc { display:block; width:100%; color:var(--muted); font-size:.86rem; }
    .chips { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 12px 18px; }
    .chips span, .office { background:#f4f8fa; border:1px solid var(--line); border-radius:12px; }
    .chips span { border-radius:999px; padding:4px 9px; font-size:.8rem; }
    .offices { display:grid; gap:8px; margin:0 0 12px; }
    .office { padding:10px 12px; }
    .office strong { display:block; }
    .office span { color:var(--muted); font-size:.84rem; }
    .index { margin-top:16px; overflow:auto; background:#fff; border:1px solid var(--line); border-radius:18px; }
    table { width:100%; border-collapse:collapse; min-width:640px; }
    th, td { text-align:left; padding:12px 14px; border-bottom:1px solid var(--line); }
    th { background:#f7fafb; color:var(--muted); font-size:.8rem; }
    td a { color:#086972; }
    .note { margin-top:16px; background:#fff; border-left:4px solid var(--cyan); border-radius:12px; padding:14px 16px; }
    footer { color:var(--muted); font-size:.85rem; padding-bottom:24px; }
    .hidden { display:none !important; }
    @media (min-width:720px) {
      .stats { grid-template-columns:repeat(4,minmax(0,1fr)); }
      .toolbar { flex-direction:row; }
      .toolbar .panel:first-child { flex:1; }
      .grid { grid-template-columns:1fr 1fr; }
      .wide { grid-column:1 / -1; }
      .offices { grid-template-columns:1fr 1fr; }
    }
    @media (max-width:719px) { .brand { flex-direction:column; } }
  </style>
</head>
<body>
  <header class="hero"><div class="wrap">
    <div class="brand"><a class="logo" href="https://www.northgo.com/"><img class="logo-img" src="northgo-logo.png" alt="Northgo" width="324" height="63"><span class="logo-version">v1.0.3</span></a><div class="meta"><span data-i18n="meta"></span><a href="northgo-sitemap-tree.html" data-i18n="treeLink"></a></div></div>
    <h1 data-i18n="h1"></h1>
    <p class="lede" data-i18n="ledeFull"></p>
    <div class="stats">
      <div class="stat"><b>44</b><span data-i18n="statPages"></span></div>
      <div class="stat"><b>4</b><span data-i18n="statServices"></span></div>
      <div class="stat"><b>7</b><span data-i18n="statOffices"></span></div>
      <div class="stat"><b>4</b><span data-i18n="statNews"></span></div>
    </div>
  </div></header>
  <div class="wrap toolbar">
    <div class="panel"><input id="q" class="search" type="search" autocomplete="off"></div>
    <div class="panel">
      <div class="locales">
        <button type="button" data-locale="zh-tw" aria-pressed="true">繁體中文</button>
        <button type="button" data-locale="en">English</button>
        <button type="button" data-locale="ja">日本語</button>
        <button type="button" data-locale="vi">Tiếng Việt</button>
      </div>
      <p class="hint" data-i18n="hint"></p>
    </div>
  </div>
  <main class="wrap">
    <p id="empty" class="hidden" data-i18n="empty"></p>
    <div class="grid" id="grid"></div>
    <section class="index"><table>
      <caption data-i18n="indexTitle" style="caption-side:top;text-align:left;padding:16px 14px 0;font-weight:700;"></caption>
      <thead><tr><th data-i18n="colPage"></th><th data-i18n="colPath"></th><th data-i18n="colLocale"></th><th data-i18n="colStatus"></th></tr></thead>
      <tbody id="index-body"></tbody>
    </table></section>
    <section class="note"><h2 data-i18n="noteTitle"></h2><ul><li data-i18n="note1"></li><li data-i18n="note2"></li><li data-i18n="note3"></li><li data-i18n="note4"></li></ul></section>
  </main>
  <footer><div class="wrap"><span data-i18n="footer"></span><span class="version">版本 <span id="site-version">1.0.3</span></span></div></footer>
  <script src="sitemap-data.js"></script>
  <script>
    const prefixes = { en:"", "zh-tw":"/zh-tw", ja:"/ja", vi:"/vi" };
    const htmlLang = { en:"en", "zh-tw":"zh-Hant", ja:"ja", vi:"vi" };
    const localeNames = { en:"English", "zh-tw":"繁體中文", ja:"日本語", vi:"Tiếng Việt" };
    const blocks = [
      ["homeH","badgePage","homeP",[{k:"homeName",p:"/",d:"homeDesc",c:[{k:"servicesAnchor",p:"/#our-services",a:1},{k:"whyName",p:"/#why-northgo",a:1,d:"whyDesc"}]}]],
      ["aboutH","badgePage","aboutP",[{k:"aboutName",p:"/about",c:[{k:"vision",d:"visionDesc"},{k:"mission",d:"missionDesc"},{k:"values",d:"valuesDesc"},{k:"story",d:"storyDesc"}]}]],
      ["svcH","svcCount","svcP",[{k:"freight",p:"/services/freight-logistics",d:"freightDesc",c:[{k:"ocean",p:"/services/freight-logistics#ocean-freight",a:1,d:"oceanDesc"},{k:"air",p:"/services/freight-logistics#air-freight",a:1},{k:"land",p:"/services/freight-logistics#land-transport",a:1},{k:"customs",p:"/services/freight-logistics#customs-clearance",a:1,d:"customsDesc"}]},{k:"project",p:"/services/project-logistics",d:"projectDesc",chips:["chipOil","chipOff","chipInfra","chipRail","chipRenew"]},{k:"warehouse",p:"/services/warehouse-logistics",d:"warehouseDesc"},{k:"shipping",p:"/services/shipping-agency",d:"shippingDesc",chips:["vDry","vTank","vBreak","vCruise","vOff","vSpec","vBox","vCar"]}],1,["tpe","txg","khh","lax","sgn","tyo","osa"]],
      ["legalH","legalCount","legalP",[{k:"privacy",p:"/legal/privacy-policy"},{k:"terms",p:"/legal/terms"},{k:"cookie",p:"/legal/cookie-policy"},{k:"disclaimer",p:"/legal/disclaimer"}]],
      ["otherH",null,"otherP",[{k:"news",p:"/news",bad:1,d:"newsDesc"}]]
    ];
    const indexKeys = ["homeName","freight","project","warehouse","shipping","aboutName","contactName","privacy","terms","cookie","disclaimer"];
    const indexPaths = ["/", "/services/freight-logistics","/services/project-logistics","/services/warehouse-logistics","/services/shipping-agency","/about","/contact","/legal/privacy-policy","/legal/terms","/legal/cookie-policy","/legal/disclaimer"];
    function routeFor(path, locale) {
      const prefix = prefixes[locale];
      if (path === "/") return prefix || "/";
      if (path.startsWith("/#")) return (prefix || "/") + path.slice(1);
      return prefix + path;
    }
    function row(node, text, locale) {
      const li = document.createElement("li");
      li.className = "node";
      if (node.p) {
        const a = document.createElement("a");
        const route = routeFor(node.p, locale);
        a.href = "https://www.northgo.com" + route;
        a.innerHTML = '<span class="name"></span><span class="path"></span>';
        a.querySelector(".name").textContent = text[node.k];
        a.querySelector(".path").textContent = route;
        if (node.a || node.bad) {
          const b = document.createElement("span");
          b.className = "badge " + (node.bad ? "bad" : "anchor");
          b.textContent = node.bad ? "404" : text.anchor;
          a.insertBefore(b, a.querySelector(".path"));
        }
        if (node.d) { const d = document.createElement("span"); d.className = "desc"; d.textContent = text[node.d]; a.appendChild(d); }
        li.appendChild(a);
      } else {
        const s = document.createElement("span");
        s.className = "plain";
        s.innerHTML = '<span class="name"></span>';
        s.querySelector(".name").textContent = text[node.k];
        if (node.d) { const d = document.createElement("span"); d.className = "desc"; d.textContent = text[node.d]; s.appendChild(d); }
        li.appendChild(s);
      }
      if (node.c) { const ul = document.createElement("ul"); node.c.forEach((child) => ul.appendChild(row(child, text, locale))); li.appendChild(ul); }
      if (node.chips) { const box = document.createElement("div"); box.className = "chips"; node.chips.forEach((key) => { const s = document.createElement("span"); s.textContent = text[key]; box.appendChild(s); }); li.appendChild(box); }
      return li;
    }
    function render(locale) {
      const text = SITEMAP_COPY[locale];
      document.documentElement.lang = htmlLang[locale];
      document.title = text.pageTitle;
      document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = text[el.dataset.i18n] || ""; });
      document.getElementById("q").placeholder = text.searchPh;
      document.querySelectorAll("[data-locale]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.locale === locale)));
      const grid = document.getElementById("grid");
      grid.replaceChildren();
      blocks.forEach((block) => {
        const card = document.createElement("section");
        card.className = "card" + (block[4] ? " wide" : "");
        const h2 = document.createElement("h2");
        h2.appendChild(document.createTextNode(text[block[0]]));
        if (block[1]) { const b = document.createElement("span"); b.className = "badge"; b.textContent = text[block[1]]; h2.appendChild(b); }
        card.appendChild(h2);
        const p = document.createElement("p"); p.textContent = text[block[2]]; card.appendChild(p);
        const ul = document.createElement("ul"); ul.className = "tree";
        block[3].forEach((item) => ul.appendChild(row(item, text, locale)));
        card.appendChild(ul);
        if (block[0] === "homeH") {
          const contact = {k:"contactName", p:"/contact", c:[{k:"enquire", p:"/contact#enquiry-form", a:1, d:"enquireDesc"},{k:"officesName", p:"/contact#locations", a:1}]};
          const offices = document.createElement("div"); offices.className = "offices";
          ["tpe","txg","khh","lax","sgn","tyo","osa"].forEach((id) => {
            const box = document.createElement("div"); box.className = "office";
            box.innerHTML = "<strong></strong><span></span>";
            box.querySelector("strong").textContent = text[id + "Name"];
            box.querySelector("span").textContent = text[id + "Line"];
            offices.appendChild(box);
          });
          const contactCard = document.createElement("section");
          contactCard.className = "card wide";
          const title = document.createElement("h2");
          title.textContent = text.contactH;
          const badge = document.createElement("span"); badge.className = "badge"; badge.textContent = text.badgePage; title.appendChild(badge);
          const intro = document.createElement("p"); intro.textContent = text.contactP;
          const list = document.createElement("ul"); list.className = "tree"; list.appendChild(row(contact, text, locale));
          contactCard.append(title, intro, list, offices);
          grid.appendChild(card);
          grid.appendChild(contactCard);
          return;
        }
        grid.appendChild(card);
      });
      const body = document.getElementById("index-body");
      body.replaceChildren();
      indexKeys.forEach((key, i) => {
        const route = routeFor(indexPaths[i], locale);
        const tr = document.createElement("tr");
        const name = document.createElement("td"); name.textContent = text[key];
        const path = document.createElement("td");
        const a = document.createElement("a"); a.href = "https://www.northgo.com" + route; a.textContent = route; path.appendChild(a);
        const lang = document.createElement("td"); lang.textContent = localeNames[locale];
        const status = document.createElement("td"); status.textContent = "200";
        tr.append(name, path, lang, status);
        body.appendChild(tr);
      });
    }
    document.querySelectorAll("[data-locale]").forEach((button) => button.addEventListener("click", () => { render(button.dataset.locale); filter(); }));
    function filter() {
      const value = document.getElementById("q").value.trim().toLowerCase();
      let shown = 0;
      document.querySelectorAll("#grid > section").forEach((section) => {
        const hit = !value || section.textContent.toLowerCase().includes(value);
        section.classList.toggle("hidden", !hit);
        if (hit) shown += 1;
      });
      document.querySelectorAll("#index-body tr").forEach((row) => row.classList.toggle("hidden", Boolean(value) && !row.textContent.toLowerCase().includes(value)));
      document.getElementById("empty").classList.toggle("hidden", shown !== 0);
    }
    document.getElementById("q").addEventListener("input", filter);
    render("zh-tw");
  </script>
</body>
</html>
